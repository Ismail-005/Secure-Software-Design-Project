{% extends "base.html" %}
{% block title %}Withdraw{% endblock %}
{% block content %}
<h1>Withdraw from {{ account.account_number }}</h1>
<form method="POST">
  {{ form.hidden_tag() }}
  {{ form.nonce() }}
  <label>Amount: <input type="number" name="amount" id="withdraw-amount" step="0.01" min="0.01"></label><br>
  <button type="submit" id="withdraw-btn">Withdraw</button>
</form>
<a href="{{ url_for('accounts.account_detail', account_id=account.id) }}">Back</a>
{% endblock %}
