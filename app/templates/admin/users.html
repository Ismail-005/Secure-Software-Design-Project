{% extends "base.html" %}
{% block title %}User Management{% endblock %}
{% block content %}
<h1>Users</h1>
<table border="1" cellpadding="4">
  <tr><th>ID</th><th>Username</th><th>Role</th><th>Locked Until</th><th>Actions</th></tr>
  {% for user in users %}
  <tr>
    <td>{{ user.id }}</td>
    <td>{{ user.username }}</td>
    <td>{{ user.role.value }}</td>
    <td>{{ user.locked_until or 'Active' }}</td>
    <td>
      <form method="POST" action="{{ url_for('admin.update_role', user_id=user.id) }}" style="display:inline">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <select name="role">
          {% for r in ['customer','teller','manager','admin'] %}
          <option value="{{ r }}" {% if user.role.value == r %}selected{% endif %}>{{ r }}</option>
          {% endfor %}
        </select>
        <button type="submit">Update</button>
      </form>
      <form method="POST" action="{{ url_for('admin.lock_user', user_id=user.id) }}" style="display:inline">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button type="submit">Lock</button>
      </form>
    </td>
  </tr>
  {% endfor %}
</table>
{% endblock %}
